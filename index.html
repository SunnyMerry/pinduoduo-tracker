<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinduoduo Credit Card Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-pdd { background-color: #e02e24; }
    .text-pdd { color: #e02e24; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header / Navbar -->
  <header class="bg-pdd text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-bag-shopping text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Pinduoduo Credit Card Tracker</h1>
      </div>
      <button onclick="promptForUrl()" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow-inner">
        <i class="fa-solid fa-gear"></i> <span id="urlStatus">Setup Backend API</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Status Alert Banner -->
    <div id="statusAlert" class="hidden p-4 rounded-lg text-sm font-medium transition-all shadow-sm"></div>

    <!-- Purchase Entry Form -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-pdd"></i> Add New Pinduoduo Purchase
      </h2>

      <form id="purchaseForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Date -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Purchase Date</label>
            <input type="date" id="purchaseDate" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>

          <!-- Credit Card -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Credit Card Used</label>
            <input type="text" id="creditCard" placeholder="e.g., BPI Visa, Citi Rewards" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
        </div>

        <!-- Product Name -->
        <div>
          <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
          <input type="text" id="productName" placeholder="e.g., Ergonomic Mechanical Keyboard" required
            class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>

        <!-- Specifications / Details -->
        <div>
          <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Specifications / Variant Details</label>
          <textarea id="specs" rows="2" placeholder="e.g., Tri-mode Wireless, Brown Switches, RGB Backlight"
            class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Price / Amount Paid -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Amount Paid (Card Charge)</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-gray-400 font-bold">₱</span>
              <input type="number" step="0.01" id="price" placeholder="0.00" required
                class="w-full pl-8 p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>
          </div>

          <!-- Notes -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Notes / Shipping Status (Optional)</label>
            <input type="text" id="notes" placeholder="e.g., Shipped to forwarding warehouse"
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn"
          class="w-full bg-pdd hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Save to Google Sheets</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('purchaseDate').valueAsDate = new Date();

    const form = document.getElementById('purchaseForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');
    const urlStatus = document.getElementById('urlStatus');

    let apiUrl = localStorage.getItem('PDD_API_URL') || '';

    function updateUrlUI() {
      if (apiUrl) {
        urlStatus.textContent = "Backend Connected";
      } else {
        urlStatus.textContent = "Setup Backend API";
      }
    }
    updateUrlUI();

    function promptForUrl() {
      const input = prompt("Paste your Sheet.best (or API) URL here:", apiUrl);
      if (input !== null) {
        apiUrl = input.trim();
        localStorage.setItem('PDD_API_URL', apiUrl);
        updateUrlUI();
        if (apiUrl) {
          showAlert("API URL updated successfully!", "bg-green-100 text-green-800 border border-green-300");
        }
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!apiUrl) {
        promptForUrl();
        if (!apiUrl) return;
      }

      // Match exact column headers in your Google Sheet
      const payload = {
        "Date": document.getElementById('purchaseDate').value,
        "Product Name": document.getElementById('productName').value,
        "Specifications / Details": document.getElementById('specs').value,
        "Price / Amount Paid": document.getElementById('price').value,
        "Credit Card Used": document.getElementById('creditCard').value,
        "Notes / Status": document.getElementById('notes').value
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving to Google Drive...`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Network response was not ok');

        showAlert('Successfully saved to your Google Sheet!', 'bg-green-100 text-green-800 border border-green-300');
        form.reset();
        document.getElementById('purchaseDate').valueAsDate = new Date();

      } catch (error) {
        console.error('Error uploading purchase:', error);
        showAlert('Failed to save. Please check your API URL.', 'bg-red-100 text-red-800 border border-red-300');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Save to Google Sheets</span>`;
      }
    });

    function showAlert(message, classes) {
      statusAlert.className = `p-4 rounded-lg text-sm font-medium transition-all shadow-sm ${classes}`;
      statusAlert.textContent = message;
      statusAlert.classList.remove('hidden');

      setTimeout => { statusAlert.classList.add('hidden'); }, 5000);
    }
  </script>
</body>
</html>
