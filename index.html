<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinduoduo Credit Card Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js for Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .bg-pdd { background-color: #e02e24; }
    .text-pdd { color: #e02e24; }
    .border-pdd { border-color: #e02e24; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

  <!-- Header / Navbar -->
  <header class="bg-pdd text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-bag-shopping text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Pinduoduo Credit Card Tracker</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadDashboardData()" class="text-xs bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow-inner">
          <i class="fa-solid fa-rotate"></i> Refresh Data
        </button>
        <button onclick="promptForUrl()" class="text-xs bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow-inner">
          <i class="fa-solid fa-gear"></i> <span id="urlStatus">API Setup</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Status Alert Banner -->
    <div id="statusAlert" class="hidden p-4 rounded-lg text-sm font-medium transition-all shadow-sm"></div>

    <!-- Analytics Dashboard Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase text-gray-400">Total Spent</p>
          <h3 id="statTotalSpent" class="text-2xl font-extrabold text-gray-800 mt-1">₱0.00</h3>
        </div>
        <div class="w-12 h-12 bg-red-50 text-pdd rounded-xl flex items-center justify-center text-xl shadow-inner">
          <i class="fa-solid fa-peso-sign"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase text-gray-400">Total Orders</p>
          <h3 id="statTotalOrders" class="text-2xl font-extrabold text-gray-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl shadow-inner">
          <i class="fa-solid fa-box-archive"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase text-gray-400">Credit Cards Used</p>
          <h3 id="statTotalCards" class="text-2xl font-extrabold text-gray-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl shadow-inner">
          <i class="fa-solid fa-credit-card"></i>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="text-sm font-bold uppercase text-gray-500 mb-3"><i class="fa-solid fa-chart-pie text-pdd mr-1"></i> Spending by Credit Card</h3>
        <div class="relative h-64 flex items-center justify-center">
          <canvas id="cardChart"></canvas>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="text-sm font-bold uppercase text-gray-500 mb-3"><i class="fa-solid fa-chart-column text-pdd mr-1"></i> Recent Spending Trend</h3>
        <div class="relative h-64 flex items-center justify-center">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Grid Layout for Form & Recent History -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Purchase Entry Form (1 Column) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 lg:col-span-1 h-fit">
        <h2 class="text-md font-bold text-gray-700 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-pdd"></i> Add New Purchase
        </h2>

        <form id="purchaseForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Purchase Date</label>
            <input type="date" id="purchaseDate" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Credit Card Used</label>
            <input type="text" id="creditCard" placeholder="e.g., BPI Visa, Citi Rewards" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
            <input type="text" id="productName" placeholder="e.g., Mechanical Keyboard" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Specifications / Variant</label>
            <textarea id="specs" rows="2" placeholder="e.g., Brown Switches, RGB"
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm"></textarea>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Amount Paid (₱)</label>
            <input type="number" step="0.01" id="price" placeholder="0.00" required
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Notes / Status (Optional)</label>
            <input type="text" id="notes" placeholder="e.g., Shipped"
              class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-pdd hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Save to Google Sheet</span>
          </button>
        </form>
      </div>

      <!-- Table History (2 Columns) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 lg:col-span-2 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-md font-bold text-gray-700 flex items-center gap-2">
            <i class="fa-solid fa-list text-pdd"></i> Purchase History
          </h2>
          <span id="recordCount" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-semibold">0 items</span>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider">
                <th class="p-3 rounded-l-lg">Date</th>
                <th class="p-3">Product</th>
                <th class="p-3">Card</th>
                <th class="p-3 text-right rounded-r-lg">Amount</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100">
              <tr>
                <td colspan="4" class="p-6 text-center text-gray-400">Loading purchases from Google Drive...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.getElementById('purchaseDate').valueAsDate = new Date();

    const form = document.getElementById('purchaseForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');
    const urlStatus = document.getElementById('urlStatus');
    const tableBody = document.getElementById('tableBody');

    let apiUrl = localStorage.getItem('PDD_API_URL') || '';
    let cardChartInstance = null;
    let trendChartInstance = null;

    function updateUrlUI() {
      urlStatus.textContent = apiUrl ? "Connected" : "API Setup";
    }
    updateUrlUI();

    function promptForUrl() {
      const input = prompt("Paste your Sheet.best API URL here:", apiUrl);
      if (input !== null) {
        apiUrl = input.trim();
        localStorage.setItem('PDD_API_URL', apiUrl);
        updateUrlUI();
        if (apiUrl) {
          showAlert("API URL updated!", "bg-green-100 text-green-800 border border-green-300");
          loadDashboardData();
        }
      }
    }

    // Fetch and render data from Google Sheet via Sheet.best
    async function loadDashboardData() {
      if (!apiUrl) return;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Failed to fetch data');
        const rows = await response.json();

        processDashboard(rows);
      } catch (error) {
        console.error('Error loading dashboard:', error);
        tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500 text-xs">Could not load data. Check your API URL or sheet permissions.</td></tr>`;
      }
    }

    function processDashboard(rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        document.getElementById('statTotalSpent').textContent = '₱0.00';
        document.getElementById('statTotalOrders').textContent = '0';
        document.getElementById('statTotalCards').textContent = '0';
        document.getElementById('recordCount').textContent = '0 items';
        tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400">No purchases logged yet. Add your first one!</td></tr>`;
        return;
      }

      let totalSpent = 0;
      let cardTotals = {};
      let trendData = {};

      tableBody.innerHTML = '';
      
      // Sort rows by date descending if possible
      rows.reverse();

      rows.forEach((row, index) => {
        const date = row['Date'] || 'N/A';
        const product = row['Product Name'] || 'Untitled Product';
        const specs = row['Specifications / Details'] || '';
        const card = row['Credit Card Used'] || 'Unknown Card';
        const price = parseFloat(row['Price / Amount Paid']) || 0;

        totalSpent += price;

        // Tally Card Totals
        cardTotals[card] = (cardTotals[card] || 0) + price;

        // Tally Trend Dates
        trendData[date] = (trendData[date] || 0) + price;

        // Append Table Row
        if (index < 25) { // Show up to latest 25
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-gray-50 transition';
          tr.innerHTML = `
            <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${date}</td>
            <td class="p-3">
              <div class="font-bold text-gray-800">${product}</div>
              <div class="text-xs text-gray-400">${specs}</div>
            </td>
            <td class="p-3 text-xs text-gray-600">${card}</td>
            <td class="p-3 text-right font-semibold text-gray-900 whitespace-nowrap">₱${price.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
          `;
          tableBody.appendChild(tr);
        }
      });

      // Update Metric Cards
      document.getElementById('statTotalSpent').textContent = `₱${totalSpent.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      document.getElementById('statTotalOrders').textContent = rows.length;
      document.getElementById('statTotalCards').textContent = Object.keys(cardTotals).length;
      document.getElementById('recordCount').textContent = `${rows.length} items`;

      // Render Charts
      renderCharts(cardTotals, trendData);
    }

    function renderCharts(cardTotals, trendData) {
      // Card Pie Chart
      const cardCtx = document.getElementById('cardChart').getContext('2d');
      if (cardChartInstance) cardChartInstance.destroy();

      cardChartInstance = new Chart(cardCtx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(cardTotals),
          datasets: [{
            data: Object.values(cardTotals),
            backgroundColor: ['#e02e24', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
      });

      // Trend Bar Chart
      const trendCtx = document.getElementById('trendChart').getContext('2d');
      if (trendChartInstance) trendChartInstance.destroy();

      const sortedDates = Object.keys(trendData).sort();
      const sortedValues = sortedDates.map(d => trendData[d]);

      trendChartInstance = new Chart(trendCtx, {
        type: 'bar',
        data: {
          labels: sortedDates,
          datasets: [{
            label: 'Daily Spend (₱)',
            data: sortedValues,
            backgroundColor: '#e02e24',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    // Handle Form Submit
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!apiUrl) {
        promptForUrl();
        if (!apiUrl) return;
      }

      const payload = {
        "Date": document.getElementById('purchaseDate').value,
        "Product Name": document.getElementById('productName').value,
        "Specifications / Details": document.getElementById('specs').value,
        "Price / Amount Paid": document.getElementById('price').value,
        "Credit Card Used": document.getElementById('creditCard').value,
        "Notes / Status": document.getElementById('notes').value
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([payload])
        });

        if (!response.ok) throw new Error('Failed to save');

        showAlert('Successfully saved to Google Sheet!', 'bg-green-100 text-green-800 border border-green-300');
        form.reset();
        document.getElementById('purchaseDate').valueAsDate = new Date();
        
        // Refresh dashboard instantly
        loadDashboardData();

      } catch (error) {
        console.error('Error uploading purchase:', error);
        showAlert('Failed to save. Check your connection.', 'bg-red-100 text-red-800 border border-red-300');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Save to Google Sheet</span>`;
      }
    });

    function showAlert(message, classes) {
      statusAlert.className = `p-4 rounded-lg text-sm font-medium transition-all shadow-sm ${classes}`;
      statusAlert.textContent = message;
      statusAlert.classList.remove('hidden');
      setTimeout(() => { statusAlert.classList.add('hidden'); }, 5000);
    }

    // Load data on start if API URL exists
    if (apiUrl) {
      loadDashboardData();
    }
  </script>
</body>
</html>
